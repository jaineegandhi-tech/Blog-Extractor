services:
  - type: web
    name: blog-extractor-api
    env: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps

    startCommand: celery -A app.workers.celery_app worker --pool=solo --loglevel=info & exec gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: CELERY_BROKER_URL
        sync: false

      - key: CELERY_RESULT_BACKEND
        sync: false